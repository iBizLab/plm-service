  server:
    port: 48080
  
  spring:
    profiles:
      include: sys
    application:
      name: ibizplm
    cloud:
      nacos:
        discovery:
          server-addr: http://nacos:8848
          group: ibiz_config_group
        config:
          server-addr: http://nacos:8848
          group: ibiz_config_group
          file-extension: yaml
  
  ibiz:
    servicehub:
      id: ibizplm
      #register-naming-service: false
      #publish-config: false
      #启用调试代码
      enableRTCodeMode: true
    tenant: true
  
  #生产环境需要关闭
  springfox:
    documentation:
      enabled: true
  
  logging:
    level:
      net.ibizsys.central.cloud: debug
      net.ibizsys.central: debug
      net.ibizsys.runtime: debug
      cn.ibizlab.plm: debug